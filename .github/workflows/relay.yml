name: weather relay
on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub may delay scheduled runs by several minutes; the app shows the data age
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: relay
  cancel-in-progress: false
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch official products
        run: ./relay/fetch.sh
      - name: Commit if changed
        run: |
          git config user.name "zephyr-relay"
          git config user.email "relay@users.noreply.github.com"
          git add data/latest.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "relay: $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          # push with retries: GitHub occasionally answers a push with a transient 500 (run #40, 2026-11-04 09:51Z)
          for i in 1 2 3 4; do
            if git push; then exit 0; fi
            echo "push attempt $i failed; rebasing and retrying in $((i*20)) s"; sleep $((i*20))
            git fetch origin main && git rebase origin/main || { git rebase --abort; git reset --hard origin/main; ./relay/fetch.sh; git add data/latest.json; git commit -m "relay: $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]" || true; }
          done
          echo "push failed after 4 attempts"; exit 1
