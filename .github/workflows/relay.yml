name: weather relay
on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub may delay scheduled runs by several minutes; the app shows the data age
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: relay
  cancel-in-progress: false
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official products
        run: ./relay/fetch.sh
      - name: Commit if changed
        run: |
          git config user.name "zephyr-relay"
          git config user.email "relay@users.noreply.github.com"
          git add data/latest.json
          if git diff --cached --quiet; then echo "no change"; else git commit -m "relay: $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]" && git push; fi
